services:
  - type: worker
    name: AloneX
    runtime: python

    buildCommand: pip install -r requirements.txt
startCommand: python -m AloneX

    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: LOGGER_ID
        sync: false
      - key: MONGO_URL
        sync: false
      - key: OWNER_ID
        sync: false
      - key: SESSION
        sync: false
      - key: YT_API_KEY
        sync: false
      - key: YTPROXY_URL
        sync: false
        
